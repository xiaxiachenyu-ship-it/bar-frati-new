<!doctype html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BAR FRATI · 点餐系统</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#192333;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#152b48;color:white;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:22px;margin:0}nav{display:flex;gap:8px}button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;font-size:15px}nav button{background:#344964;color:white}nav button.active,.primary{background:#087c67;color:white}.wrap{max-width:1150px;margin:22px auto;padding:0 16px}.columns{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.panel{background:white;border-radius:16px;padding:20px;box-shadow:0 3px 16px #152b4810;margin-bottom:16px}h2{margin:0 0 16px;font-size:19px}.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.dish{border:1px solid #e2e6ec;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}.dish button{background:#e5f5f0;color:#075a4c}.muted{color:#64748b;font-size:13px}input,textarea{border:1px solid #ccd3de;border-radius:9px;padding:11px;font:inherit;width:100%;margin:5px 0 12px}textarea{resize:vertical}ul{padding:0;list-style:none}.cartitem{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:9px 0;gap:8px}.qty{display:flex;align-items:center;gap:8px}.qty button{padding:5px 10px}.order{border:1px solid #dce3ec;border-radius:12px;padding:15px;margin-bottom:12px}.order.new{border-left:6px solid #ec9a23}.order.preparing{border-left:6px solid #3579d5}.order.done{border-left:6px solid #0a9b6c}.orderhead{display:flex;justify-content:space-between;gap:10px}.status{font-weight:700}.order button{margin:5px 6px 0 0}.hide{display:none!important}.full{width:100%}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row input{flex:1;min-width:130px}.alarm-banner{background:#fff0e8;border:2px solid #e35b37;border-radius:12px;padding:14px;margin-bottom:14px;font-weight:700}.alarm-banner button{background:#087c67;color:white;margin:6px 6px 0 0}.alarm-note{font-size:13px;color:#64748b;margin:10px 0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#20324b;color:white;padding:12px 20px;border-radius:10px;display:none}@media(max-width:700px){.columns{grid-template-columns:1fr}.wrap{margin-top:12px}header{padding:14px}.panel{padding:15px}}
</style></head><body><header><h1>🍜 BAR FRATI · 全新点餐系统 V2</h1><nav><button id="nav-front" class="active" onclick="switchPage('front')">前台点餐</button><button id="nav-kitchen" onclick="switchPage('kitchen')">后厨订单</button><button id="nav-admin" onclick="switchPage('admin')">菜品管理</button></nav></header><main class="wrap"><section id="front" class="columns"><div class="panel"><h2>选择菜品</h2><div id="categories" class="row" style="margin-bottom:15px"></div><div id="menu" class="menu"></div></div><div class="panel"><h2>当前订单</h2><label>用餐方式 · Modalità</label><div class="row" style="margin:8px 0 14px"><label><input type="radio" name="orderType" value="dinein" checked onchange="toggleOrderType()" style="width:auto;margin:0 5px 0 0">在这里吃 · Mangiare qui</label><label><input type="radio" name="orderType" value="takeaway" onchange="toggleOrderType()" style="width:auto;margin:0 5px 0 0">外带 · Da asporto</label></div><div id="takeawayFields" class="hide"><label>取餐时间 · Ora di ritiro</label><input id="pickupTime" type="time"><label>客人姓名或编号（可选） · Nome / Numero</label><input id="customerName" placeholder="例如：Mario / 01"></div><ul id="cart"></ul><h2 id="total">合计 €0.00</h2><label>备注</label><textarea id="note" rows="3" placeholder="例如：不要辣"></textarea><button class="primary full" onclick="submitOrder()">发送到后厨 →</button></div></section><section id="kitchen" class="hide"><div class="panel"><h2>👨‍🍳 后厨实时订单</h2><div class="row"><button id="enableAlarm" class="primary" onclick="enableAlarm()">🔊 开启中文语音提醒</button><button onclick="testAlarm()">🗣️ 测试语音</button></div><p class="alarm-note" id="alarmState">请先点击“开启中文语音提醒”；iPhone 需保持页面在前台、屏幕亮起。</p><div id="alarmBanner" class="alarm-banner hide"><span id="alarmCount"></span><br><button onclick="acknowledgeAlarm()">我已看到，停止铃声</button></div><p class="muted">新订单会自动出现；点击按钮更新制作状态。</p><div id="orders"></div></div></section><section id="admin" class="hide"><div class="panel"><h2>管理菜单</h2><p class="muted">示例菜单可删除或自行添加实际菜品。</p><div id="adminMenu"></div><h2>添加菜品</h2><form onsubmit="addDish(event)"><input id="dishName" required placeholder="菜品名称"><div class="row"><input id="dishPrice" required type="number" step="0.01" min="0" placeholder="价格 €"><input id="dishCategory" placeholder="分类，如：主食"></div><button class="primary" type="submit">添加菜品</button></form></div></section></main><div id="toast" class="toast"></div><script src="/socket.io/socket.io.js"></script><script>
let menu=[],orders=[],cart={};let alarmEnabled=false,audioCtx=null,alarmTimer=null,alarmAcknowledged=new Set(),alarmInitialized=false;let activeCategory="全部";const $=id=>document.getElementById(id);const euro=n=>'€'+Number(n).toFixed(2);function msg(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function switchPage(page){['front','kitchen','admin'].forEach(p=>{$(p).classList.toggle('hide',p!==page);$('nav-'+p).classList.toggle('active',p===page)});location.hash=page;if(page==='kitchen')setTimeout(updateAlarm,0);else if(alarmTimer){clearInterval(alarmTimer);alarmTimer=null}}async function api(url,options){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options?.headers||{})}});if(!r.ok)throw Error((await r.json().catch(()=>({}))).error||'操作失败');return r.status===204?null:r.json()}async function refresh(){try{[menu,orders]=await Promise.all([api('/api/menu'),api('/api/orders')]);render()}catch(e){msg(e.message)}}function render(){renderMenu();renderCart();renderOrders();renderAdmin();updateAlarm()}function renderMenu(){const cats=['全部',...new Set(menu.map(d=>d.category))];$('categories').innerHTML=cats.map((c,i)=>`<button style="background:${activeCategory===c?'#087c67':'#e8eef4'};color:${activeCategory===c?'white':'#24354c'}" onclick="activeCategory=decodeURIComponent('${encodeURIComponent(c)}');renderMenu()">${safe(c)}</button>`).join('');$('menu').innerHTML=menu.filter(d=>activeCategory==='全部'||d.category===activeCategory).map(d=>`<div class="dish"><b>${safe(d.name.split(' / ')[0])}</b><span class="muted">${safe(d.name.split(' / ').slice(1).join(' / '))}</span><strong>${euro(d.price)}</strong><button onclick="addCart(${d.id})">+ 加入订单</button></div>`).join('')||'暂无菜品'}function keyFor(id,extra=''){return id+'|'+extra}function addCart(id){const d=menu.find(x=>x.id===id);if(!d)return;let extra='';if(d.extras){const answer=prompt('选择加料：输入 0 不加料、1 加肉 (+€1)、2 加虾 (+€1)','0');if(answer===null)return;if(!['0','1','2'].includes(answer))return msg('请输入 0、1 或 2');extra=answer==='1'?'肉 / Carne':answer==='2'?'虾 / Gamberi':''}const k=keyFor(id,extra);cart[k]=(cart[k]||0)+1;renderCart()}function changeQty(k,d){cart[k]=(cart[k]||0)+d;if(cart[k]<=0)delete cart[k];renderCart()}function renderCart(){let total=0;$('cart').innerHTML=Object.entries(cart).map(([k,qty])=>{const [id,extra]=k.split('|');const d=menu.find(x=>x.id==id);if(!d)return '';const price=d.price+(extra?1:0);total+=price*qty;return `<li class="cartitem"><span>${safe(d.name)}${extra?'<br>+ '+safe(extra):''}<br><b>${euro(price*qty)}</b></span><div class="qty"><button onclick="changeQty('${k}',-1)">−</button>${qty}<button onclick="changeQty('${k}',1)">+</button></div></li>`}).join('')||'<li class="muted">还没有选择菜品</li>';$('total').textContent='合计 '+euro(total)}function toggleOrderType(){const takeaway=document.querySelector('input[name="orderType"]:checked').value==='takeaway';$('takeawayFields').classList.toggle('hide',!takeaway)}async function submitOrder(){const items=Object.entries(cart).map(([k,qty])=>{const [id,extra]=k.split('|');return {id:Number(id),extra,qty}});if(!items.length)return msg('请先选择菜品');const orderType=document.querySelector('input[name="orderType"]:checked').value;const pickupTime=$('pickupTime').value;if(orderType==='takeaway'&&!pickupTime)return msg('请选择客人几点来取餐');try{await api('/api/orders',{method:'POST',body:JSON.stringify({orderType,pickupTime,customerName:$('customerName').value,items,note:$('note').value})});cart={};$('note').value='';$('customerName').value='';$('pickupTime').value='';renderCart();msg('订单已发送到后厨')}catch(e){msg(e.message)}}function renderOrders(){$('orders').innerHTML=orders.map(o=>{const type=o.orderType==='takeaway'?'🥡 外带 · Da asporto':o.orderType==='dinein'?'🍽️ 在这里吃 · Mangiare qui':o.table?'旧订单 · '+safe(o.table):'订单';const pickup=o.orderType==='takeaway'?`<div style="font-size:22px;font-weight:800;color:#b54708;margin:10px 0">⏰ ${safe(o.pickupTime||'未填写')} 来取 · Ritiro</div>`:'';return `<article class="order ${o.status}"><div class="orderhead"><strong>${type}</strong><span class="status">${({new:'🔔 新订单',preparing:'🍳 制作中',done:'✅ 已完成'})[o.status]||''}</span></div>${pickup}${o.customerName?`<p>客人：${safe(o.customerName)}</p>`:''}<div class="muted">订单号：${safe(o.id.slice(-6).toUpperCase())} · 下单：${new Date(o.createdAt).toLocaleString('zh-CN')}</div><ul>${o.items.map(i=>`<li>${safe(i.name)} × ${i.qty}</li>`).join('')}</ul>${o.note?`<p>备注：${safe(o.note)}</p>`:''}<b>合计 ${euro(o.items.reduce((sum,i)=>sum+i.price*i.qty,0))}</b><div>${o.status==='new'?`<button class="primary" onclick="setStatus('${o.id}','preparing')">开始制作</button>`:''}${o.status!=='done'?`<button onclick="setStatus('${o.id}','done')">标记完成</button>`:''}<button style="background:#fff0f0;color:#a52222;border:1px solid #e5a6a6;margin-left:8px" onclick="deleteOrder('${o.id}')">🗑️ 删除订单</button></div></article>`}).join('')||'<p class="muted">暂无订单</p>'}async function setStatus(id,status){try{await api('/api/orders/'+id,{method:'PATCH',body:JSON.stringify({status})});await refresh()}catch(e){msg(e.message)}}async function deleteOrder(id){const order=orders.find(o=>o.id===id);if(!order)return;const shortId=order.id.slice(-6).toUpperCase();if(!confirm('确定永久删除订单 '+shortId+' 吗？删除后无法恢复。'))return;try{await api('/api/orders/'+encodeURIComponent(id),{method:'DELETE'});alarmAcknowledged.add(id);await refresh();msg('订单已删除')}catch(e){msg(e.message)}}function renderAdmin(){$('adminMenu').innerHTML=menu.map(d=>`<div class="cartitem"><span>${safe(d.name)} · ${euro(d.price)}</span><button onclick="deleteDish(${d.id})">删除</button></div>`).join('')}async function addDish(e){e.preventDefault();try{await api('/api/menu',{method:'POST',body:JSON.stringify({name:$('dishName').value,price:$('dishPrice').value,category:$('dishCategory').value})});e.target.reset();await refresh();msg('菜品已添加')}catch(err){msg(err.message)}}async function deleteDish(id){if(!confirm('确认删除此菜品？'))return;try{await api('/api/menu/'+id,{method:'DELETE'});await refresh()}catch(e){msg(e.message)}}function speakNewOrder(){
  if(!alarmEnabled||!('speechSynthesis' in window))return;
  try{
    const synth=window.speechSynthesis;
    if(synth.speaking||synth.pending)return;
    const utter=new SpeechSynthesisUtterance('有新的订单！有新的订单！');
    utter.lang='zh-CN';utter.rate=0.92;utter.pitch=1.05;utter.volume=1;
    const voices=synth.getVoices();
    const chinese=voices.find(v=>v.lang.toLowerCase().startsWith('zh'));
    if(chinese)utter.voice=chinese;
    synth.speak(utter);
  }catch(e){console.warn('语音播放失败',e)}
}
function announce(){beep();speakNewOrder()}
function beep(){if(!audioCtx)return;try{if(audioCtx.state==='suspended')audioCtx.resume();const t=audioCtx.currentTime;for(let i=0;i<3;i++){const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=i===1?920:740;gain.gain.setValueAtTime(0.0001,t+i*.29);gain.gain.exponentialRampToValueAtTime(.18,t+i*.29+.025);gain.gain.exponentialRampToValueAtTime(.0001,t+i*.29+.23);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t+i*.29);osc.stop(t+i*.29+.24)}}catch(e){console.warn(e)}}function enableAlarm(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();alarmEnabled=true;$('enableAlarm').textContent='🔊 中文语音已开启';$('alarmState').textContent='中文语音已开启。请保持后厨页面打开、手机不要锁屏。';announce();updateAlarm()}catch(e){msg('无法播放声音，请检查浏览器设置')}}function testAlarm(){if(!alarmEnabled){enableAlarm();return}announce()}function acknowledgeAlarm(){if('speechSynthesis' in window)window.speechSynthesis.cancel();orders.filter(o=>o.status==='new').forEach(o=>alarmAcknowledged.add(o.id));updateAlarm()}function updateAlarm(){if(location.hash!=='#kitchen')return;const pending=orders.filter(o=>o.status==='new'&&!alarmAcknowledged.has(o.id));$('alarmBanner').classList.toggle('hide',pending.length===0);$('alarmCount').textContent='🔔 '+pending.length+' 笔新订单等待确认！';if(alarmTimer){clearInterval(alarmTimer);alarmTimer=null}if(pending.length&&alarmEnabled){announce();alarmTimer=setInterval(()=>{if(document.visibilityState==='visible'&&location.hash==='#kitchen')announce()},8000)}}
const socket=io();socket.on('refresh',refresh);socket.on('connect',refresh);setInterval(()=>{if(location.hash==='#kitchen')refresh()},15000);switchPage(['front','kitchen','admin'].includes(location.hash.slice(1))?location.hash.slice(1):'front');refresh();
</script></body></html>
